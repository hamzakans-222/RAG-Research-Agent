name: rag-agent

services:
  pgvector:
    image: pgvector/pgvector:pg17-bookworm
    container_name: RAG_agent
    restart: unless-stopped
    environment:
      POSTGRES_DB: RAG_agent
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init/01-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  adminer:
    image: adminer:6
    container_name: RAG_agent_adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: pgvector
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  pgdata:
