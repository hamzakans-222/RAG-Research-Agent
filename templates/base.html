{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3f1">
  <meta name="description" content="Research assistant — Explorez vos documents et donnez de la clarté à vos recherches.">
  <title>{% block title %}Research assistant{% endblock %}</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=research-1">
  <script src="{% static 'js/app.js' %}?v=research-1" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Aller au contenu</a>
  {% include 'icons.html' %}
  {% block body %}{% endblock %}
</body>
</html>
